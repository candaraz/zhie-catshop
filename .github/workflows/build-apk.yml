name: Build Zhie Catshop Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build Web & Android APK
        env:
          VITE_SUPABASE_URL: https://abtlrdtsabfbwckmqwnp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ddX1l_GYKaiGl-TM82xjyQ_RELSjPUS
        run: |
          set -ex
          ls -la

          # 1. Kalau ada file .zip di repo, ekstrak otomatis
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done

          # 2. Kalau package.json ada di dalam subfolder, angkat ke root
          if [ ! -f "package.json" ]; then
            FOUND_PKG=$(find . -maxdepth 3 -name "package.json" | head -n 1)
            if [ -n "$FOUND_PKG" ]; then
              DIR=$(dirname "$FOUND_PKG")
              cp -r "$DIR"/* .
            fi
          fi

          # 3. Kalau yang diupload adalah source project lengkap (ada package.json)
          if [ -f "package.json" ]; then
            npm install
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npm run build
          elif [ -f "index.html" ]; then
            # Kalau yang diupload adalah zhie-catshop-deploy.zip (sudah ter-build)
            mkdir -p dist
            cp -r index.html assets icons logo.png manifest.webmanifest sw.js dist/ 2>/dev/null || true
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
          else
            echo "ERROR: File proyek belum di-upload ke repository ini!"
            exit 1
          fi

          # 4. Buat proyek Android bersih & build APK
          rm -rf android capacitor.config.ts capacitor.config.json
          npx cap init "Zhie Catshop" id.zhiecatshop.pos --web-dir dist
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Zhie-Catshop.apk

      - name: Upload Zhie-Catshop.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zhie-Catshop-APK
          path: ./Zhie-Catshop.apk
