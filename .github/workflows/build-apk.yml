name: Build Zhie Catshop Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies & Build Web App
        env:
          VITE_SUPABASE_URL: https://abtlrdtsabfbwckmqwnp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ddX1l_GYKaiGl-TM82xjyQ_RELSjPUS
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Zhie-Catshop.apk

      - name: Upload Zhie-Catshop.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zhie-Catshop-APK
          path: ./Zhie-Catshop.apk
